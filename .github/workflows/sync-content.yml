name: Sync Content to Reference Library

on:
  push:
    paths:
      - "content/posts/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync content to library
        run: python sync.py

      - name: Commit updated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library/knowledge_base.json
          if git diff --cached --quiet; then
            echo "参考库无变化，跳过提交。"
          else
            git commit -m "chore: auto-sync reference library [skip ci]"
            git push
          fi
